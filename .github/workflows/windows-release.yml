name: Build Windows installer and release

on:
  push:
    branches: [main]
    paths:
      - aura-rgb/**
      - installer/**
      - scripts/build-windows.ps1
      - .github/workflows/windows-release.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 45
    permissions:
      contents: read
    outputs:
      version: ${{ steps.build.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24.19.0'
          architecture: x64
          package-manager-cache: false
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'
      - name: Test and build Windows packages
        id: build
        shell: pwsh
        run: ./scripts/build-windows.ps1
      - uses: actions/upload-artifact@v7
        with:
          name: prism-windows-${{ github.sha }}
          path: artifacts/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  release:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: prism-windows-${{ github.sha }}
          path: artifacts
      - name: Verify checksums and publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BUILD_SHA: ${{ github.sha }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          tag="v$VERSION"
          short_version="${VERSION%.0}"
          installer="PRISM-Setup-$short_version.exe"
          (cd artifacts && sha256sum --check SHA256SUMS.txt)
          tag_sha=""
          if tag_sha=$(gh api "repos/$GH_REPO/commits/$tag" --jq '.sha' 2>/dev/null); then
            if [[ "$tag_sha" != "$BUILD_SHA" ]]; then
              echo "Tag $tag already points to a different commit; increase the version before publishing."
              exit 1
            fi
          fi
          if gh api "repos/$GH_REPO/releases/tags/$tag" > current-release.json 2>/dev/null; then
            target=$(jq -r '.target_commitish' current-release.json)
            draft=$(jq -r '.draft' current-release.json)
            if [[ "$target" != "$BUILD_SHA" ]]; then
              echo "Release $tag already belongs to a different commit; increase the version before publishing."
              exit 1
            fi
            if [[ "$draft" != "true" ]]; then
              [[ "$tag_sha" == "$BUILD_SHA" ]]
              echo "Release $tag is already published for this commit."
              exit 0
            fi
          else
            gh release create "$tag" --draft --target "$BUILD_SHA" \
              --title "PRISM RGB Studio $short_version" --notes-file artifacts/release-notes.md
          fi
          gh release upload "$tag" "artifacts/$installer" \
            artifacts/PRISM-RGB-Windows.zip artifacts/SHA256SUMS.txt --clobber
          gh release edit "$tag" --draft=false --latest
          published_sha=$(gh api "repos/$GH_REPO/commits/$tag" --jq '.sha')
          [[ "$published_sha" == "$BUILD_SHA" ]]
